{% extends 'base.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto; border-top: 4px solid var(--color-error);">
    <h2>¿Eliminar categoría?</h2>
    <p style="margin-bottom: 1.5rem;">
        Estás a punto de eliminar <strong>"{{ categoria|default:object }}"</strong>. Esta acción no se puede deshacer.
    </p>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 0.75rem;">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_categorias' %}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
